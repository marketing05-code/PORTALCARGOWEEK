<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adivina la Palabra · Cargoweek</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f5;color:#07172b;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:24px 16px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #53647a;padding-bottom:14px}
.brand{font-weight:900;letter-spacing:.12em}
.phase{font-size:12px;letter-spacing:2px;color:#8290a0}
h1{text-align:center;font-size:clamp(30px,6vw,50px);margin:26px 0 6px}
.sub{text-align:center;color:#526173;line-height:1.45}
.selector{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.phaseCard{background:#fff;border:1px solid #8190a0;border-radius:18px;padding:18px;text-align:center;position:relative}
.phaseCard.active{border:2px solid #f28c28;box-shadow:0 8px 24px rgba(7,23,43,.08)}
.phaseCard.locked{opacity:.55}
.phaseNum{font-size:13px;font-weight:900;letter-spacing:.14em;color:#6c7988}
.phaseName{font-weight:900;font-size:20px;margin:8px 0}
.status{font-size:12px;font-weight:800}
.status.open{color:#15803d}.status.closed{color:#6b7280}
.lock{font-size:25px;margin-bottom:6px}
.card{margin-top:18px;background:#fff;border:1px solid #56667a;border-radius:22px;padding:22px}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
input,select,button{font:inherit;padding:13px;border-radius:11px}
input,select{border:1px solid #657489;background:#e8edf2;color:#07172b}
button{background:#f2f4f7;color:#07172b;font-weight:800;border:0;cursor:pointer}
button.primary{background:#07172b;color:#fff}
.game,.end{display:none}
.level{text-align:center;font-weight:900;letter-spacing:.12em;color:#c46b16;margin:6px 0}
.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#526173;font-weight:700}
.stats strong{color:#07172b}
.progress{height:8px;background:#d6dde5;border-radius:20px;margin:16px 0;overflow:hidden}
.bar{height:100%;background:#f28c28;width:10%;transition:.3s}
.emoji{font-size:clamp(55px,12vw,100px);text-align:center;min-height:190px;display:grid;place-items:center;letter-spacing:8px}
.answerRow{display:flex;gap:10px}
.answerRow input{flex:1;text-align:center;font-size:18px;text-transform:uppercase}
.feedback{text-align:center;min-height:45px;padding-top:14px;font-weight:800}
.correct{color:#15803d}.wrong{color:#b91c1c}
.next{display:none;margin:7px auto}
.end{text-align:center}
.score{font-size:55px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.box{background:#e8edf2;border:1px solid #52627a;padding:15px;border-radius:13px}.box b{display:block;font-size:23px;margin-top:5px}
.note{text-align:center;color:#657386;font-size:12px;margin-top:17px}
#startMsg{text-align:center;font-weight:700;color:#b91c1c;margin-top:12px;min-height:20px}
@media(max-width:650px){
  .selector{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .answerRow{flex-direction:column}
  .grid{grid-template-columns:1fr}
}
</style>
<style id="cw-demo-css">
#cwDemoBtn{width:100%;min-height:46px;margin:10px 0;border:1px solid #56a3ff;border-radius:12px;background:#0a2347;color:#fff;font-weight:900;cursor:pointer}
#cwDemo{position:fixed;inset:0;z-index:99999;background:rgba(2,10,22,.9);display:none;align-items:center;justify-content:center;padding:16px}
#cwDemo.open{display:flex}.cw-box{width:min(620px,100%);background:#071d37;color:#fff;border:1px solid #49617c;border-radius:20px;padding:20px;text-align:center}
.cw-box h2{color:#56a3ff;margin:0 0 12px}.cw-box p{color:#c7d4e3;line-height:1.5}.cw-scene{margin:18px 0;padding:24px 10px;border:1px solid #355675;border-radius:14px;background:#06172c;font-size:clamp(22px,6vw,38px);font-weight:900}
.cw-tip{font-size:13px;color:#9fd0ff;background:#0b294c;padding:10px;border-radius:10px;margin:14px 0}
#cwClose{width:100%;min-height:46px;border:0;border-radius:12px;background:linear-gradient(90deg,#0752a9,#1873d8);color:#fff;font-weight:900;cursor:pointer}
</style></head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">CARGO</div>
    <div style="text-align:right"><div class="phase">CARGOWEEK</div><b>RETO LOGÍSTICO</b></div>
  </div>

  <h1>ADIVINA LA PALABRA 🧩</h1>
  <div class="sub">Solo la fase programada para hoy estará disponible. Las demás permanecerán bloqueadas.</div>

  <div class="selector" id="phaseSelector"></div>

  <section class="card" id="start">
    <div class="level" id="levelTitle"></div>
    <div class="sub" id="levelDesc" style="margin-bottom:18px"></div>
    <div class="form">
      <input id="name" placeholder="Nombre completo" maxlength="60">
      <select id="branch">
        <option value="">Selecciona tu sucursal</option>
        <option>Estado de México</option><option>Buenos Aires</option><option>Victoria</option>
        <option>Nuevo Repueblo</option><option>Leamington</option><option>Tampico</option>
        <option>Ontario</option><option>Detroit</option><option>San Antonio</option><option>Laredo</option>
      </select>
      <button class="primary" id="startBtn" type="button">COMENZAR</button>
    </div>
    <div id="startMsg"></div>
  </section>

  <section class="card game" id="game">
    <div class="stats">
      <span>PREGUNTA <strong id="num"></strong></span>
      <span>⏱ <strong id="timer"></strong></span>
      <span>ERRORES <strong id="errors">0</strong></span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="emoji" id="emoji"></div>
    <form id="answerForm" class="answerRow">
      <input id="answer" placeholder="ESCRIBE TU RESPUESTA" autocomplete="off">
      <button type="submit">COMPROBAR</button>
    </form>
    <div id="feedback" class="feedback"></div>
    <button id="nextBtn" class="next" type="button">SIGUIENTE →</button>
  </section>

  <section class="card end" id="end">
    <div class="phase" id="endPhase"></div>
    <h2>¡RETO COMPLETADO! 🚚</h2>
    <div class="score" id="score"></div>
    <div class="grid">
      <div class="box">ACIERTOS<b id="fh"></b></div>
      <div class="box">ERRORES<b id="fe"></b></div>
      <div class="box">TIEMPO<b id="ft"></b></div>
    </div>
    <p>Tu resultado ha sido registrado.</p>
  </section>

  <div class="note" id="note"></div>
</div>

<script>
/* ============================================================
   CAMBIA SOLO ESTE NÚMERO EN GITHUB:
   1 = FASE 1
   2 = FASE 2
   3 = FASE 3
   ============================================================ */
const FASE_ACTIVA = 1;

const SHEET_URL = "https://script.google.com/macros/s/AKfycbw_-mPjVf7ZcCzHfAKCb-qQ_TJZzqtD8OxEkiRgRrHaxTR1CIRLsk8-Mikkt-kYkGIV/exec";

const FASES = {
  1: {
    nombre: "FASE 1",
    nivel: "NIVEL INICIAL",
    descripcion: "Descifra conceptos logísticos usando emojis. Solo tienes una oportunidad por participante.",
    limite: 600000,
    preguntas: [
      ["🚚 📦","ENTREGA",["entrega","entregar"]],
      ["❄️ 🚛","CARGA REFRIGERADA",["carga refrigerada","refrigerado","carga fria"]],
      ["📦 🔍","INSPECCIÓN",["inspeccion","revision"]],
      ["🏭 📦 🚚","DISTRIBUCIÓN",["distribucion"]],
      ["📦 🏠","ALMACÉN",["almacen","bodega"]],
      ["🚚 🇲🇽 ➡️ 🇺🇸","CRUCE FRONTERIZO",["cruce fronterizo","cruce de frontera","frontera"]],
      ["📋 📦 📦","INVENTARIO",["inventario"]],
      ["📍 🚚 🏁","DESTINO",["destino","entrega final"]],
      ["🛒 📦 🚚","E-COMMERCE",["ecommerce","e-commerce","comercio electronico"]],
      ["🚢 📦","CARGA MARÍTIMA",["carga maritima","transporte maritimo"]]
    ]
  },
  2: {
    nombre: "FASE 2",
    nivel: "NIVEL INTERMEDIO",
    descripcion: "Palabras de oficina y operación. Solo tienes una oportunidad por participante.",
    limite: 600000,
    preguntas: [
      ["🖨️ 📄","IMPRESORA",["impresora"]],
      ["🪪 👤","GAFETE",["gafete","credencial"]],
      ["📎 📄","CLIP",["clip","sujetapapeles"]],
      ["⌨️ 🖥️","TECLADO",["teclado"]],
      ["🖱️ 🖥️","MOUSE",["mouse","raton"]],
      ["📂 📄","ARCHIVO",["archivo","carpeta"]],
      ["📅 ⏰","AGENDA",["agenda","calendario"]],
      ["☎️ 🗣️","LLAMADA",["llamada","telefono"]],
      ["📦 🏷️","ETIQUETA",["etiqueta","etiquetado"]],
      ["🚚 📍","RASTREO",["rastreo","seguimiento","tracking"]]
    ]
  },
  3: {
    nombre: "FASE 3",
    nivel: "RETO EXPERTO",
    descripcion: "Último nivel: conceptos más retadores de operación y logística. Solo tienes una oportunidad por participante.",
    limite: 480000,
    preguntas: [
      ["📦 🔢 📋","INVENTARIO",["inventario"]],
      ["🚚 🛃 📄","ADUANA",["aduana"]],
      ["❄️ 📦 🚚","CARGA REFRIGERADA",["carga refrigerada","refrigerado"]],
      ["📍 🚚 📱","RASTREO",["rastreo","seguimiento","tracking"]],
      ["🏭 📦 📋","ALMACÉN",["almacen","bodega"]],
      ["📦 🔒 🏷️","SELLO DE SEGURIDAD",["sello de seguridad","sello"]],
      ["🚚 ⏰ ⚠️","RETRASO",["retraso","demora"]],
      ["🧾 📦 💰","FACTURA",["factura"]],
      ["📋 ✅ 🚚","CHECKLIST",["checklist","lista de verificacion","lista de chequeo"]],
      ["📦 🚚 🏁","ENTREGA FINAL",["entrega final","entrega"]]
    ]
  }
};

const $ = s => document.querySelector(s);
const cfg = FASES[FASE_ACTIVA];
let Q = cfg.preguntas;
let LIMIT = cfg.limite;
let i=0, err=0, hits=0, startAt=0, tick=null, locked=false;

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
}
function participantKey(name,branch){
  return "adivinaPalabraUnificadoFase"+FASE_ACTIVA+"::"+norm(name)+"::"+norm(branch);
}
function fmt(ms){
  const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), cs=Math.floor((ms%1000)/10);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(cs).padStart(2,"0");
}
function elapsed(){ return Date.now()-startAt; }
function remaining(){ return Math.max(0,LIMIT-elapsed()); }

function paintSelector(){
  $("#phaseSelector").innerHTML = [1,2,3].map(n=>{
    const active=n===FASE_ACTIVA;
    return `<div class="phaseCard ${active?"active":"locked"}">
      <div class="lock">${active?"🔓":"🔒"}</div>
      <div class="phaseNum">FASE ${n}</div>
      <div class="phaseName">${FASES[n].nivel}</div>
      <div class="status ${active?"open":"closed"}">${active?"DISPONIBLE":"BLOQUEADA"}</div>
    </div>`;
  }).join("");
}

function setup(){
  paintSelector();
  $("#levelTitle").textContent = cfg.nombre+" · "+cfg.nivel;
  $("#levelDesc").textContent = cfg.descripcion;
  $("#timer").textContent = fmt(LIMIT);
  $("#note").textContent = "Tiempo máximo: "+Math.round(LIMIT/60000)+" minutos.";
}
setup();

function render(){
  const q=Q[i];
  $("#num").textContent=(i+1)+"/"+Q.length;
  $("#bar").style.width=((i+1)/Q.length*100)+"%";
  $("#emoji").textContent=q[0];
  $("#answer").value="";
  $("#feedback").textContent="";
  $("#feedback").className="feedback";
  $("#answerForm").style.display="flex";
  $("#nextBtn").style.display="none";
  locked=false;
  $("#answer").focus();
}

$("#startBtn").addEventListener("click",()=>{
  const name=$("#name").value.trim();
  const branch=$("#branch").value;
  $("#startMsg").textContent="";

  if(!name || !branch){
    $("#startMsg").textContent="Escribe tu nombre y selecciona tu sucursal.";
    return;
  }

  const key=participantKey(name,branch);
  if(localStorage.getItem(key)==="1"){
    $("#startMsg").textContent="Ya utilizaste tu única oportunidad para jugar la Fase "+FASE_ACTIVA+".";
    return;
  }

  localStorage.setItem(key,"1");

  $("#start").style.display="none";
  $("#phaseSelector").style.display="none";
  $("#game").style.display="block";
  startAt=Date.now();

  tick=setInterval(()=>{
    const r=remaining();
    $("#timer").textContent=fmt(r);
    if(r<=0){
      clearInterval(tick);
      finish(true);
    }
  },40);

  render();
});

$("#answerForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(locked) return;

  const v=norm($("#answer").value);
  if(!v) return;

  const q=Q[i];
  const ok=q[2].some(a=>norm(a)===v);
  locked=true;

  if(ok){
    hits++;
    $("#feedback").textContent="✓ ¡CORRECTO! "+q[1];
    $("#feedback").className="feedback correct";
  }else{
    err++;
    $("#errors").textContent=err;
    $("#feedback").textContent="✕ RESPUESTA: "+q[1];
    $("#feedback").className="feedback wrong";
  }

  $("#answerForm").style.display="none";
  $("#nextBtn").style.display="block";
  $("#nextBtn").textContent=i===Q.length-1 ? "VER RESULTADO" : "SIGUIENTE →";
});

$("#nextBtn").addEventListener("click",()=>{
  i++;
  if(i<Q.length) render();
  else finish(false);
});

function finish(timeout=false){
  clearInterval(tick);
  const total=Math.min(elapsed(),LIMIT);

  $("#game").style.display="none";
  $("#end").style.display="block";
  $("#endPhase").textContent="FASE "+FASE_ACTIVA+" COMPLETADA";
  $("#score").textContent=hits+"/"+Q.length;
  if(timeout) $("#end h2").textContent="¡TIEMPO TERMINADO! ⏱️";

  $("#fh").textContent=hits;
  $("#fe").textContent=err;
  $("#ft").textContent=fmt(total);

  const payload={
    nombre:$("#name").value.trim(),
    sucursal:$("#branch").value,
    aciertos:hits,
    errores:err,
    tiempo:fmt(total),
    tiempoMs:total,
    juego:"Adivina la Palabra",
    fase:"Fase "+FASE_ACTIVA
  };

  fetch(SHEET_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  }).catch(()=>{});
}
</script>
<script id="cw-demo-js">
(()=>{
const s=document.getElementById('startBtn');if(!s)return;
const b=document.createElement('button');b.type='button';b.id='cwDemoBtn';b.textContent='▶ VER DEMOSTRACIÓN';s.insertAdjacentElement('beforebegin',b);
const o=document.createElement('div');o.id='cwDemo';o.innerHTML=`<div class="cw-box"><h2>🧩 ADIVINA LA PALABRA</h2><div class="cw-scene">🚚 📦  →  ENTREGA ✓</div><p>Observa los emojis, identifica el concepto y escribe tu respuesta. Ejemplo: 🚚 + 📦 = ENTREGA.</p><div class="cw-tip">✨ Puedes ver esta demostración cuantas veces quieras. No inicia el cronómetro, no envía resultados y no consume oportunidades.</div><button type="button" id="cwClose">ENTENDIDO · VOLVER AL INICIO</button></div>`;document.body.appendChild(o);
b.addEventListener('click',()=>o.classList.add('open'));
o.querySelector('#cwClose').addEventListener('click',()=>o.classList.remove('open'));
o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')});
})();
</script></body>
</html>
