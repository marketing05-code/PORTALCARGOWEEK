<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cargoweek · Portal de Juegos</title>
<style>
:root{--navy:#06172c;--panel:#0b203b;--panel2:#07172f;--blue:#1873d8;--blue2:#0752a9;--bright:#56a3ff;--text:#fff;--muted:#b9c8d8;--line:#49617c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,rgba(86,163,255,.16),transparent 30%),linear-gradient(180deg,#06172c,#0a2347 55%,#06172c)}
.wrap{width:min(1180px,100%);margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0 24px;border-bottom:1px solid var(--line)}
.brand small{display:block;color:#a9cfff;letter-spacing:.18em;font-weight:800;margin-bottom:8px}.brand h1{margin:0;font-size:clamp(34px,7vw,68px);line-height:.92}.brand p{margin:12px 0 0;color:var(--muted);max-width:650px;line-height:1.5}
.badge{border:1px solid var(--line);background:#071a35cc;border-radius:18px;padding:15px 18px;text-align:center}.badge b{display:block;font-size:25px;color:var(--bright)}.badge span{font-size:11px;color:var(--muted);letter-spacing:.1em}
.section-title{margin:28px 0 14px;font-size:14px;letter-spacing:.18em;color:#a9cfff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.game{background:linear-gradient(180deg,#0b203be8,#07172ff2);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 45px rgba(0,0,0,.22)}
.game-head{display:flex;gap:14px;align-items:flex-start}.icon{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:#0a2347;border:1px solid #355675;font-size:31px;flex:0 0 auto}
.game h2{margin:2px 0 6px;font-size:22px}.game p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.phase{border:1px solid #355675;background:#082342;border-radius:12px;padding:9px 6px;text-align:center}.phase b{display:block;font-size:11px;margin-top:3px}.phase small{display:block;color:#9fb0bf;font-size:9px;margin-top:3px}.phase.active{border:2px solid var(--bright)}.phase.locked{opacity:.42}
.play{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:12px;background:linear-gradient(90deg,var(--blue2),var(--blue));color:#fff;text-decoration:none;font-weight:900}
.footer{margin-top:22px;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;color:#a9cfff;font-size:12px;letter-spacing:.12em;font-weight:800}
@media(max-width:760px){.wrap{padding:12px}.badge{display:none}.grid{grid-template-columns:1fr}.game{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="brand"><small>CARGOWEEK · RETO LOGÍSTICO</small><h1>PORTAL DE<br>JUEGOS 🚚</h1><p>Elige un reto y completa la fase disponible. Cada juego conserva su propio registro de resultados.</p></div><div class="badge"><span>FASE ACTIVA</span><b id="activePhaseText">1</b></div></header>
<div class="section-title">SELECCIONA UN JUEGO</div>
<main class="grid" id="games"></main>
<div class="footer">CARGOWEEK · 5 RETOS · 3 FASES</div>
</div>
<script>
const FASE_ACTIVA = 1;
const JUEGOS=[
{nombre:"Adivina la Palabra",icono:"🧩",descripcion:"Descifra conceptos de logística y oficina usando emojis.",url:"adivina-la-palabra/"},
{nombre:"Ruta Cargo",icono:"🚚",descripcion:"Recoge cajas, aumenta tu carga y evita obstáculos.",url:"ruta-cargo/"},
{nombre:"Reto Logístico",icono:"🧭",descripcion:"Lleva el camión hasta META en el menor tiempo posible.",url:"laberinto/"},
{nombre:"Clasifica la Carga",icono:"📦",descripcion:"Clasifica correctamente las cargas mientras avanzan por la banda.",url:"clasifica-la-carga/"},
{nombre:"Misión: Entrega Final",icono:"🔐",descripcion:"Supera las pruebas, desbloquea la ruta y completa la entrega.",url:"mision-entrega-final/"}
];
document.getElementById("activePhaseText").textContent=FASE_ACTIVA;
document.getElementById("games").innerHTML=JUEGOS.map(j=>`<section class="game"><div class="game-head"><div class="icon">${j.icono}</div><div><h2>${j.nombre}</h2><p>${j.descripcion}</p></div></div><div class="phases">${[1,2,3].map(n=>{const active=n===FASE_ACTIVA;return `<div class="phase ${active?"active":"locked"}"><div>${active?"🔓":"🔒"}</div><b>FASE ${n}</b><small>${active?"DISPONIBLE":"BLOQUEADA"}</small></div>`}).join("")}</div><a class="play" href="${j.url}">ENTRAR AL JUEGO →</a></section>`).join("");
</script>
</body>
</html>
